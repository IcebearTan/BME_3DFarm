# ============================================================
# BME_3DFarm 打印机清单（业务侧）
# ------------------------------------------------------------
# 本地测试环境：只配一台 Bambuddy 虚拟打印机 VP-P1S-01
# （对应 Bambuddy 容器里 virtual_printers.id=1）。
#
# 真机上线时：先在 Bambuddy 加好真机，把它分到的 printer_id 填到下面
# 新条目的 bambuddy_printer_id（source 改 real），现场确认 has_ams，再跑 sync。
#
# 用法：改完跑  python scripts/sync_printers.py  按 public_name upsert。
# 注意：
#   - sync_printers.py 只 upsert 不清理；从 yaml 删条目后需手动从 printer 表删旧行。
#   - Virtual Printer 同时会被 Celery poller 从 Bambuddy /virtual-printers 自动同步
#     （按 bambuddy_printer_id + source 匹配），不写在这里也会出现；
#     写在这里是为了显式声明 has_ams / enabled 等业务字段，作为单一真相源。
# ============================================================
printers:
  - public_name: VP-P1S-01
    bambuddy_printer_id: 1           # Bambuddy virtual_printers.id（本地虚拟机）
    source: virtual                  # poller 按 (bambuddy_printer_id, source) 匹配
    model: P1S
    has_ams: false                   # 虚拟机无 AMS
    enabled: true
    capabilities: {}
