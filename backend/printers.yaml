# ============================================================
# BME_3DFarm 打印机清单（业务侧）
# ------------------------------------------------------------
# 用法：
#   1. 先在 Bambuddy 里加好打印机（Bambuddy 自己存 IP/序列号/Access Code，
#      这些连接信息不写在本文件，也不进 BME_3DFarm 数据库）。
#   2. Bambuddy 会给每台打印机分配一个 printer_id，把它填到下面的
#      bambuddy_printer_id。
#   3. 现场确认每台是否加装 AMS，填 has_ams（true/false）。
#   4. 跑  python scripts/sync_printers.py  同步到数据库（按 public_name upsert）。
#
# enabled=false 的机器只占位，不参与调度；启用时改成 true 再 sync。
# capabilities 留空对象即可，以后需要再填尺寸/喷嘴/材料等。
# 注意：sync 是 upsert 不会删表里多余记录——从本文件删除的机子，
#       须手动从数据库清理（或在此只保留真正部署的机子）。
#
# 打印机底座 = 桥头堡机 110 上的 Bambuddy（经路由器B TCP 转发
# 172.25.56.19:18000 → 110:8000）。bambuddy_printer_id 对应 110 Bambuddy 里的 id。
# ============================================================
printers:
  - public_name: BME-112-B
    internal_name: ""
    bambuddy_printer_id: 2           # 110 Bambuddy id=2（BME-112-B，192.168.1.105，干净可用）
    source: real                     # Poller 按 (bambuddy_printer_id, source) 匹配，真机须为 real
    model: P1S
    has_ams: true                    # 现场确认：装了 AMS
    enabled: true
    capabilities: {}

  - public_name: BME-112-C
    internal_name: ""
    bambuddy_printer_id: 1           # 110 Bambuddy id=1（BME-112-C，192.168.1.101）gcode 常卡 FAILED（取消/校准残留，非 HMS 硬件故障）
    source: real
    model: P1S
    has_ams: true                    # 现场确认：装了 AMS
    enabled: true                    # 2026-07-30 启用：gcode 卡 FAILED 是取消/校准残留假象（stop_print 无效、需重启才回 idle），但综合状态管理(_map_printer_status)判 idle 可用且无 HMS
    capabilities: {}
